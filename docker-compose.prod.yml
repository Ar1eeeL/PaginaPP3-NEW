services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: prod
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ENV: production
        volumes:
            - storage_data:/var/www/html/storage/app
        depends_on:
            - db
        networks:
            - paginapp3

    web:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: prod_nginx
        restart: unless-stopped
        ports:
            - "${APP_PORT:-80}:80"
        depends_on:
            - app
        networks:
            - paginapp3

    db:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - paginapp3

networks:
    paginapp3:
        driver: bridge

volumes:
    db_data:
        driver: local
    storage_data:
        driver: local
